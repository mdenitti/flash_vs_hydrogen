<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrarealistic Globe - Fly Around Earth</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; }
        
        /* UI Overlay */
        #ui-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 100;
        }
        .ui-panel {
            pointer-events: auto;
            background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 16px;
            color: #e8f0ff;
            font-size: 13px;
            line-height: 1.6;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        #info-panel { top: 20px; left: 20px; position: absolute; min-width: 280px; max-width: 320px; }
        #poi-panel { top: 20px; right: 20px; position: absolute; width: 300px; max-height: 70vh; overflow-y: auto; }
        #controls-panel { bottom: 20px; left: 50%; transform: translateX(-50%); position: absolute; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; max-width: calc(100vw - 40px); }
        #controls-panel .speed-control { padding-left: 12px; border-left: 1px solid rgba(100, 150, 255, 0.25); }
        
        h3 { 
            margin: 0 0 12px 0; 
            font-size: 14px; 
            font-weight: 600; 
            color: #8ab4ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(100, 150, 255, 0.3);
            padding-bottom: 8px;
        }
        .info-row { display: flex; justify-content: space-between; margin: 6px 0; }
        .info-label { color: #88a0cc; }
        .info-value { color: #fff; font-weight: 500; font-family: monospace; }
        
        .poi-list { list-style: none; }
        .poi-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            margin: 6px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .poi-item:hover { background: rgba(100, 150, 255, 0.2); border-color: rgba(100, 150, 255, 0.4); }
        .poi-item.hovered { background: rgba(100, 150, 255, 0.2); border-color: rgba(100, 150, 255, 0.4); }
        .poi-item.active { background: rgba(100, 150, 255, 0.3); border-color: #6496ff; }
        .poi-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .poi-name { font-weight: 500; font-size: 13px; }
        .poi-location { font-size: 11px; color: #88a0cc; }
        .poi-distance { margin-left: auto; font-size: 11px; color: #64ff96; font-family: monospace; }
        
        .btn {
            background: linear-gradient(135deg, #1a2a4a 0%, #0d1a33 100%);
            border: 1px solid rgba(100, 150, 255, 0.4);
            color: #e8f0ff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: linear-gradient(135deg, #2a3a5a 0%, #1a2a4a 100%); border-color: #6496ff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(100, 150, 255, 0.3); }
        .btn:active { transform: translateY(0); }
        .btn.primary { background: linear-gradient(135deg, #6496ff 0%, #3a7bd5 100%); border-color: #6496ff; }
        .btn.primary:hover { background: linear-gradient(135deg, #7aa8ff 0%, #4a8bff 100%); }
        
        .speed-control { display: flex; align-items: center; gap: 12px; }
        .speed-label { color: #88a0cc; font-size: 12px; min-width: 45px; }
        #speed-slider { width: 180px; accent-color: #6496ff; }
        .speed-value { color: #64ff96; font-family: monospace; font-size: 12px; min-width: 45px; text-align: right; }
        
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 50;
        }
        .crosshair-ring {
            width: 40px; height: 40px;
            border: 2px solid rgba(100, 150, 255, 0.6);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.3); opacity: 0.3; } }
        .crosshair-center {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 4px; height: 4px;
            background: #6496ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #6496ff;
        }
        
        #poi-info { 
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.5);
            border-radius: 12px;
            padding: 16px 24px;
            color: #e8f0ff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 100;
            white-space: nowrap;
        }
        #poi-info.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        #poi-info.hidden { transform: translateX(-50%) translateY(20px); }
        
        .mode-indicator {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.4);
            border-radius: 20px;
            padding: 8px 20px;
            color: #6496ff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 100;
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            #info-panel, #poi-panel { top: 10px; left: 10px; right: 10px; min-width: auto; max-width: none; width: auto; }
            #poi-panel { top: 160px; max-height: 40vh; }
            #controls-panel { bottom: 10px; flex-direction: column; align-items: stretch; }
            .btn { justify-content: center; }
            .speed-control { justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-overlay">
        <div class="mode-indicator" id="mode-indicator">FREE FLIGHT</div>
        
        <div class="ui-panel" id="info-panel">
            <h3>Flight Data</h3>
            <div class="info-row"><span class="info-label">Altitude</span><span class="info-value" id="altitude">0 km</span></div>
            <div class="info-row"><span class="info-label">Speed</span><span class="info-value" id="speed">0 km/h</span></div>
            <div class="info-row"><span class="info-label">Latitude</span><span class="info-value" id="latitude">0°</span></div>
            <div class="info-row"><span class="info-label">Longitude</span><span class="info-value" id="longitude">0°</span></div>
            <div class="info-row"><span class="info-label">Target</span><span class="info-value" id="target">None</span></div>
        </div>
        
        <div class="ui-panel" id="poi-panel">
            <h3>Points of Interest</h3>
            <ul class="poi-list" id="poi-list"></ul>
        </div>
        
        <div class="ui-panel" id="controls-panel">
            <button class="btn primary" id="btn-fly">🚀 Fly to Target</button>
            <button class="btn" id="btn-orbit">🌍 Orbit Mode</button>
            <button class="btn" id="btn-free">✈️ Free Flight</button>
            <button class="btn" id="btn-home">🏠 Reset View</button>
            <button class="btn" id="btn-time">🌓 Toggle Day/Night</button>
            <div class="speed-control">
                <span class="speed-label">Speed</span>
                <input type="range" id="speed-slider" min="0" max="10" step="0.1" value="1">
                <span class="speed-value" id="speed-value">1.0x</span>
            </div>
        </div>
        
        <div id="crosshair">
            <div class="crosshair-ring"></div>
            <div class="crosshair-center"></div>
        </div>
        
        <div id="poi-info" class="hidden">Approaching: <span id="poi-info-name"></span> — <span id="poi-info-dist"></span></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="./main.js"></script>
</body>
</html>
